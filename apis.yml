aid: govdash
name: Govdash
description: >-
  GovDash is an end-to-end AI platform for government contracting (GovCon),
  helping companies discover, capture, price, propose, and manage federal, state,
  local, and education contracts. Its product suite spans Discover (automated bid
  matching from SAM.gov, GSA eBuy, GovWin, PIEE, and SLED portals), Capture (a
  GovCon CRM and pipeline), Pricer, Proposal (compliant proposal generation), and
  Contract lifecycle management, unified by Dash, an AI agent that synthesizes
  data and executes workflows. GovDash is FedRAMP Ready / Moderate-equivalent,
  NIST SP 800-53 and DFARS 252.204-7012 aligned for CUI, and integrates with
  Salesforce, SharePoint, Okta/Google SSO, Slack, and Microsoft Office. It
  exposes outbound webhooks (Svix) for opportunity lifecycle events. Founded 2021
  (YC W22); raised a $30M Series B in January 2026.
